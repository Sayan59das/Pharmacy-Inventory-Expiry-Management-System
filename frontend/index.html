<!doctype html>
<!--
=====================================================================
FILE        : frontend/index.html
WHAT IT DOES: The ONE html page of the React app. It is almost empty: React draws
              every screen inside <div id="root">. Vite loads src/main.jsx from here.
DEPENDS ON  : src/main.jsx (the JavaScript entry point).
USED BY     : the browser (Vite serves it at http://127.0.0.1:5173).
READ ORDER  : first file of the frontend, then src/main.jsx.
=====================================================================
-->
<html lang="en">
  <head>
    <!-- Character set: shows the rupee sign and every other symbol correctly -->
    <meta charset="UTF-8" />
    <!-- Makes the layout fit the screen width on laptops and phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tab icon: a small blue square with a white plus, drawn in SVG -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <!-- The Inter font from Google Fonts (if there is no internet the system font is used) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Pharmacy Inventory</title>
  </head>
  <body>
    <!-- React puts the whole application inside this div -->
    <div id="root"></div>
    <!-- Start the React app (type="module" lets the file use import/export) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
