<!DOCTYPE html>
<!--
=====================================================================
FILE        : frontend/suppliers.html
WHAT IT DOES: Lists the suppliers (with how much we bought from each) and lets you add a new one.
DEPENDS ON  : css/style.css, js/api.js, js/suppliers.js and the running backend.
USED BY     : you - open it from the "Suppliers" link in the navigation bar.
BACKEND CALLS: GET /suppliers, POST /suppliers (through api.js)
=====================================================================
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suppliers - Pharmacy Inventory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html"><span class="brand-mark">+</span> Pharmacy Inventory</a>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="medicines.html">Medicines</a>
                <a href="suppliers.html" aria-current="page">Suppliers</a>
                <a href="purchase.html">Purchase</a>
                <a href="sale.html">Sale</a>
                <a href="reports.html">Reports</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <div>
                <h1>Suppliers</h1>
                <p class="subtitle">Companies we buy medicines from</p>
            </div>
            <button id="showFormButton" class="btn btn-primary" type="button">Add supplier</button>
        </div>

        <!-- ========== add form (hidden until you click "Add supplier") ========== -->
        <section id="formCard" class="card hidden">
            <h2>Add supplier</h2>
            <form id="supplierForm">
                <div class="form-grid">
                    <div class="field"><label for="supplierName">Supplier name</label>
                        <input type="text" id="supplierName" maxlength="100" required></div>
                    <div class="field"><label for="contactPerson">Contact person</label>
                        <input type="text" id="contactPerson" maxlength="100"></div>
                    <div class="field"><label for="phone">Phone</label>
                        <input type="text" id="phone" maxlength="15" required></div>
                    <div class="field"><label for="email">Email</label>
                        <input type="email" id="email" maxlength="100"></div>
                    <div class="field"><label for="address">Address</label>
                        <input type="text" id="address" maxlength="255"></div>
                    <div class="field"><label for="gstNo">GST number (15 characters)</label>
                        <input type="text" id="gstNo" maxlength="15" minlength="15" required placeholder="27AABCM1234A1Z5"></div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" id="cancelFormButton" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </section>

        <!-- ========== the supplier list ========== -->
        <section class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Supplier</th><th>Contact</th><th>GST number</th><th class="num">Invoices</th>
                            <th class="num">Units bought</th><th class="num">Amount spent</th><th>Last purchase</th></tr>
                    </thead>
                    <tbody id="suppliersBody"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/suppliers.js"></script>
</body>
</html>
